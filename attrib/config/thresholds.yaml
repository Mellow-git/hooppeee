# Cadence hours by source reliability tier (scheduler).
cadence:
  tier_a_hours_min: 6   # lower bound for Tier A fetch interval
  tier_a_hours_max: 12  # upper bound for Tier A fetch interval
  tier_b_hours: 24      # Tier B fetch interval
  tier_c_hours_min: 48  # lower bound for Tier C fetch interval
  tier_c_hours_max: 72  # upper bound for Tier C fetch interval

collector:
  timeout_seconds_min: 120  # TorFetcher timeout lower bound
  timeout_seconds_max: 300  # TorFetcher timeout upper bound
  max_attempts: 3           # exponential backoff attempts before unreachable
  max_body_bytes: 10485760  # 10 MiB hard cap on fetched body
  parse_time_cap_seconds: 5 # hostile-content parse budget
  tor_proxy_url: "socks5h://tor:9050"  # D20: DNS must resolve inside Tor

infra:
  prevalence_max: 5          # discard fingerprint if more distinct hosts share it (operational, not a published rate)
  exclusion_stale_days: 14   # dashboard banner if exclusion list older than this
  exclusion_refresh_days: 7  # weekly refresh cadence

identity:
  cluster_max: 500                 # clusters larger than this: service_wallet_suspected, excluded from actor linking
  coinjoin_min_inputs: 3           # CoinJoin-like: at least this many inputs
  coinjoin_min_equal_value_outputs: 3  # and at least this many equal-value outputs

persona:
  min_corpus_words: 500            # candidate and each reference persona
  agg_window_days: 30              # aggregate same-author posts if candidate is short
  min_reference_set_size: 20       # D10: refuse stylometry below this N
  mixed_script_token_ratio_threshold: 0.15  # PLACEHOLDER — see docs/TODO_VERIFY.md
  confusable_substitution_rate_threshold: 0.05  # PLACEHOLDER — see docs/TODO_VERIFY.md
  entropy_flattening_zscore_threshold: 2.0  # PLACEHOLDER — z vs reference corpus, not a fixed authenticity score
  style_shift_delta_threshold: 1.0  # PLACEHOLDER — Burrows' Delta vs author prior window
  ngram_min: 3
  ngram_max: 5

ledger:
  concurrency_seconds: 60  # concurrent posts on same platform: Tier 3 contradicting

api:
  rate_limit_per_minute: 60
  page_size_default: 50
  page_size_max: 200

auth:
  api_key_bytes: 32  # raw key length before SHA-256 storage
