[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attrib"
version = "0.1.0"
description = "Passive public-data correlation for investigative leads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "neo4j>=5.26.0",
  "httpx[socks]>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "networkx>=3.4.0",
  "scikit-learn>=1.5.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "jinja2>=3.1.0",
  "minio>=7.2.0",
  "pycryptodome>=3.21.0",
  "confusable-homoglyphs>=3.3.0",
  "apscheduler>=3.10.4",
  "slowapi>=0.1.9",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
pdf = [
  "weasyprint>=62.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "hypothesis>=6.115.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
attrib = "attrib.cli:main"

[tool.setuptools.packages.find]
include = ["attrib*"]

[tool.setuptools.package-data]
attrib = [
  "config/*.yaml",
  "config/*.txt",
  "config/*.csv",
  "export/templates/*.j2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["attrib", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"attrib/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["attrib"]

[[tool.mypy.overrides]]
module = [
  "slowapi",
  "slowapi.*",
  "minio",
  "minio.*",
  "apscheduler",
  "apscheduler.*",
  "neo4j",
  "neo4j.*",
  "confusable_homoglyphs",
  "confusable_homoglyphs.*",
  "alembic",
  "alembic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "deprecated",
  "deprecated.*",
  "limits",
  "limits.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
markers = [
  "integration: needs Compose data services (postgres, neo4j, minio)",
  "phase1: implemented in Phase 1",
  "phase2: implemented in Phase 2",
  "phase3: implemented in Phase 3",
  "phase4: implemented in Phase 4",
  "phase5: implemented in Phase 5",
  "phase6: implemented in Phase 6",
  "phase7: implemented in Phase 7",
  "phase8: implemented in Phase 8",
]
